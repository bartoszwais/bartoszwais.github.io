<script>
  function sendPage() {
      const email = document.getElementById("email").value;
      if (!email) {
        alert("Please enter your email address.");
        return;
      }
      // Get the first paragraph inside #content
      const firstParagraph = document.querySelector("#content p");

      // Get its text
      const excerpt = firstParagraph
        ? firstParagraph.textContent.trim()
        : "";
      const subject = encodeURIComponent(document.title);
      const body = encodeURIComponent(
          `RE G U L AR L I G H T ER® EST. APRIL 8TH 2012, FRANCHISE\n\n${excerpt}\n\nHere is the page you requested:\n\n${document.title}\n${window.location.href}`
      );
      window.location.href =
      `mailto:${encodeURIComponent(email)}?subject=${subject}&body=${body}`;
  }
SimpleJekyllSearch({

  resultsContainer: document.getElementById('results-container'),
  searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
  json: '/search.json'
})
</script>
